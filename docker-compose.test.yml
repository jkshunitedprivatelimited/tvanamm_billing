# Postgres instance for local integration tests.
#   docker compose -f docker-compose.test.yml up -d
#   DATABASE_URL=postgresql://postgres:postgres@localhost:5433/jksh npm run db:migrate
#   DATABASE_URL=postgresql://postgres:postgres@localhost:5433/jksh npm test
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jksh
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 3s
      retries: 20
